name: Nikaia Vibe Experiment

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  # The compiler, on the toolchain a clone of this repository builds with.
  #
  # There is one leg because there is one toolchain (ADR-001 D1): nothing in the
  # workspace needs a nightly, so everything runs on `rust-toolchain.toml`'s
  # stable - the `rust` backend, the interpreter, projects, the ledger, the whole
  # test suite.
  bootstrap_compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Version pinning per ADR-001 D1: `rust-toolchain.toml` is the single
      # source of truth for the channel and its components, and `rustup show`
      # installs exactly what it names, so nothing is duplicated here and
      # nothing can drift.
      - name: Install the toolchain the repository names
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-stable-

      - name: Verify Environment
        run: |
          rustc --version
          cargo --version
          echo "Nikaia Experiment: Environment Ready"

      - name: Check formatting
        run: cargo fmt --all --check

      # A decision is only citable if its number is stable, so a dangling
      # `ADR-023 D7` is as much a defect as a dangling link. 700+ citations
      # live in the compiler's own comments and tests.
      - name: Check ADR citations resolve
        run: python3 scripts/check-adr-refs.py

      - name: Build the workspace
        run: cargo build --workspace --release

      - name: No clippy warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --release

      # The driver needs an input file, so run it on the samples rather than
      # bare `cargo run`, which only prints clap's usage error and exits 2.
      - name: Run Nikaia Driver (The Magic)
        run: |
          for sample in tests/samples/*.nika; do
            echo "::group::$sample"
            ./target/release/nikaia --input "$sample" --backend interpreter
            echo "::endgroup::"
          done
