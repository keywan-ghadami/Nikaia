name: Nikaia Vibe Experiment

on: [push, pull_request, workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  bootstrap_compiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Version pinning per ADR-001: `rust-toolchain.toml` is the single source
      # of truth (nightly + rustc-dev, needed to link the compiler internals).
      # `rustup show` installs exactly that toolchain and its components, so the
      # channel is never duplicated here and cannot drift.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify Environment
        run: |
          rustc --version
          cargo --version
          echo "Nikaia Experiment: Environment Ready"

      - name: Check formatting
        run: cargo fmt --all --check

      # A decision is only citable if its number is stable, so a dangling
      # `ADR-023 D7` is as much a defect as a dangling link. 700+ citations
      # live in the compiler's own comments and tests.
      - name: Check ADR citations resolve
        run: python3 scripts/check-adr-refs.py

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

      # The driver needs an input file, so run it on the samples rather than
      # bare `cargo run`, which only prints clap's usage error and exits 2.
      - name: Run Nikaia Driver (The Magic)
        run: |
          for sample in tests/samples/*.nika; do
            echo "::group::$sample"
            ./target/release/nikaia --input "$sample" --backend interpreter
            echo "::endgroup::"
          done

  # The compiler without its Bridge-IR backend, on a stable toolchain.
  #
  # `rustc-backend` is the only thing in the workspace that links
  # `rustc_private`, so it is the only thing that needs ADR-001 D1's pinned
  # nightly. Turning it off has to keep producing a whole compiler - the `rust`
  # backend, the interpreter, projects, the ledger - and `--backend bridge` has
  # to fail by name rather than fall through (ADR-021 D9). Both are claims, so
  # both are tested; `docs/nightly-cost.md` is what they were measured against.
  stable_without_the_bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deliberately *not* `rustup show`: reading `rust-toolchain.toml` is what
      # this leg exists to avoid. No nightly, and no `rustc-dev`.
      - name: Install a stable toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-stable-

      - name: Build the compiler without the bridge
        run: rustup run stable cargo build -p nikaia --no-default-features --release

      - name: No clippy warnings either
        run: >
          rustup run stable cargo clippy -p nikaia --no-default-features
          --all-targets -- -D warnings

      - name: Test
        run: rustup run stable cargo test -p nikaia --no-default-features --release
