[package]
name = "nikaia"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Turn on winnow's parser trace (`cargo run --features trace`). The grammar!
# expansion checks this feature, so it must exist here too.
trace = ["winnow-grammar/trace"]

[[bin]]
name = "nikaia"

[build-dependencies]
# `build.rs` fingerprints the compiler's own sources for the cache key.
sha2 = "0.10"
# ... and reads `[workspace.dependencies]` for the runtime versions a generated
# program declares, which a sysroot has no workspace to carry (ADR-002 D4).
toml = "0.9"

[dependencies]
orchestrator = { workspace = true }
winnow = { workspace = true }
winnow-grammar = { workspace = true }
# `nikaia.toml`'s build switches (ADR-037 D5).
toml = "0.9"
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# The tests compile emitted programs against it, so it has to be built.
nikaia-std = { workspace = true }
