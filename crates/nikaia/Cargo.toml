[package]
name = "nikaia"
version = "0.1.0"
edition = "2021"

[features]
default = ["rustc-backend"]
# Turn on winnow's parser trace (`cargo run --features trace`). The grammar!
# expansion checks this feature, so it must exist here too.
trace = ["winnow-grammar/trace"]
# The `nikaia` binary and its Bridge IR backend link the compiler's own
# internals (ADR-004). The library does not, and the split stays: a tool that
# only wants the emitter should not have to link `rustc_driver`. It is no longer
# `nikaia-std` that uses it - since ADR-002 D4 `std` is built from sources with
# its Nikaia half already lowered, and nothing in its build graph is this crate.
rustc-backend = ["dep:rustc-executor"]

[[bin]]
name = "nikaia"
required-features = ["rustc-backend"]

[build-dependencies]
# `build.rs` fingerprints the compiler's own sources for the cache key.
sha2 = "0.10"
# ... and reads `[workspace.dependencies]` for the runtime versions a generated
# program declares, which a sysroot has no workspace to carry (ADR-002 D4).
toml = "0.9"

[dependencies]
bridge-orchestrator = { workspace = true }
bridge-ir = { workspace = true }
winnow = { workspace = true }
winnow-grammar = { workspace = true }
# `nikaia.toml`'s build switches (ADR-037 D5).
toml = "0.9"
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
rustc-executor = { workspace = true, optional = true }

[dev-dependencies]
# The tests compile emitted programs against it, so it has to be built.
nikaia-std = { workspace = true }
