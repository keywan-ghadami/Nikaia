[package]
name = "nikaia-std"
version = "0.1.0"
edition = "2021"

[dependencies]
# `fs::map` maps the file (Part III, 17.1); this is the mapping.
memmap2 = "0.9"
# The parser backend every generated program runs on. Declared here, on the
# runtime, so that a program's `std` and its parser are one dependency - and
# so that the tests can find the parser's rlib by reading this crate's
# metadata rather than guessing among the copies in the deps directory.
winnow-grammar = { workspace = true }
# The UTF-8 check `fs::map` owes its `&str` views is chunked across this pool.
# The same pool the parallel piece driver uses, so a program has one - and the
# pool ADR-038 D4 starts for user code at `user_parallelism = yes`.
rayon = "1.10"
# ADR-038 D3's readiness half: `epoll`/`kqueue`/IOCP and nothing else. No
# executor, no task model, no opinion about what the program does when a socket
# is ready - which is what keeps D1's and D3's decisions from being remade by a
# dependency.
polling = "3.11"

# ADR-038 D3's completion half. A *target* gate and not a feature gate: the
# bindings do not exist off Linux at all. On Linux whether the ring is used is
# decided at **run time** (`rt::config::Method::Auto` probes the kernel), so a
# binary built on a machine with io_uring still runs on one without it.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

# **No build dependencies, and that is the point** (ADR-002 D4). This crate used
# to build the Stage 0 compiler to lower its own `src/*.nika`, which meant Cargo
# compiled the compiler library a second time inside every project's `target/` -
# 58 of a hello-world's 103 resolved packages existed only for that, `clap`,
# `toml`, `sha2` and `nikaia` itself among them. The Nikaia half is lowered at
# release time now and the `.rs` is committed beside the `.nika`, so building
# `std` needs nothing but `rustc`.
