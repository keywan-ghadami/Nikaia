[package]
name = "overlap-bench"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
# The pool a generated program already links, because `nikaia_std::task::both`
# is what the emitter names. Timing anything else would time a program this
# compiler does not produce.
rayon = "1.10"
# `--bin runtime` measures ADR-038 D4 through the real runtime rather than a
# reduction of it: `nikaia_std::fs::read_both` on the runtime `rt::start` put
# up before `main`. Timing a copy of it here would time a program this
# compiler does not produce.
nikaia-std = { workspace = true }
