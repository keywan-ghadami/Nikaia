# The Bridge-IR backend's toolchain, and nothing else's (ADR-001 D1, D5).
#
# This is the one place in the repository that names a nightly, and it is a real
# `rust-toolchain.toml` rather than a line in a script so that it can name the
# channel *and* the components in the one place rustup itself reads: a nightly
# without `rustc-dev` is not the thing ADR-004's bridge needs. `rustup show` run
# in this directory installs exactly what is written here - rustup takes the
# nearest toolchain file, so this one wins over the repository root's stable -
# and `scripts/bridge-toolchain.sh` runs a cargo command on it against the
# workspace at the root.
#
# A release is still a toolchain and not a crate (ADR-001 section 3): this
# channel and the compiler are advanced in one step.
[toolchain]
channel = "nightly-2026-01-01"
components = ["rustc-dev", "llvm-tools-preview", "rustfmt", "clippy"]
