# GitHub Pages configuration.
#
# This file publishes the documentation that already exists in this repository.
# It copies nothing and restates nothing: every page on the site is one of the
# Markdown files below, rendered where it lies. The plugins that make that work
# are enabled by GitHub Pages by default and need no Gemfile:
#
#   jekyll-readme-index          README.md becomes its directory's index page,
#                                so `/` is this repository's README and
#                                `/docs/specification/adr/` is the ADR index.
#   jekyll-optional-front-matter every .md file renders as a page without
#                                needing YAML front matter added to it.
#   jekyll-relative-links        a link to `docs/specification/adr/adr-037.md`
#                                keeps working on the site and on GitHub.
#   jekyll-titles-from-headings  a page's title is its own first heading.

title: Nikaia
description: >-
  Good wins. The Nikaia language specification, the decisions behind it,
  and the notes they were argued from.

# A project site, served under the repository name.
url: https://keywan-ghadami.github.io
baseurl: /Nikaia

theme: jekyll-theme-primer

# Every page on this site is a Markdown file with no front matter, and a page
# that names no layout is published as a bare fragment: no `<head>`, no
# stylesheet, no viewport. The theme above was built and served all along and
# nothing ever linked to it. This is what names it. `_layouts/default.html`
# overrides the theme's own layout of that name and adds the theme picker.
#
# The second entry takes the layout back off `assets/`, where the theme's
# `style.scss` also carries front matter and would otherwise be published
# wrapped in a page.
defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "assets"
    values:
      layout: null

plugins:
  - jekyll-sitemap

# What is not documentation. A user-supplied `exclude` replaces Jekyll's own
# default list rather than adding to it, so the defaults are repeated here.
exclude:
  - .jekyll-cache/
  - .sass-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  # the compiler, its tests, its benchmarks and its tooling
  - crates/
  - tests/
  - benches/
  - scripts/
  # the TextMate grammar and the VS Code extension around it. Jekyll highlights
  # with Rouge, which does not read a TextMate grammar, so nothing here reaches
  # the site's code blocks either way.
  - editors/
  - target/
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - hello_world.rs
  - hello_world
  - .github/
  # patches and findings handed to dependencies, not written for readers here
  - docs/upstream/
  # the logo's source image: 2816x1536 and 5 MB, kept in the repository and
  # not published. `nikaia-logo.jpg` is what the README shows.
  - 1768075880760.jpg

# Publish the rendered page, not a second copy of the Markdown beside it.
optional_front_matter:
  remove_originals: true
readme_index:
  remove_originals: true
