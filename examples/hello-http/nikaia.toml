# The consumer that exercises ADR-069 D1's path arm for a **Nikaia** package.
#
# The `type = "rust"` arm has `examples/foreign-runtime/`; this is the other
# one, and until this directory existed nothing in the corpus wrote it.
[package]
name = "hello-http"
version = "0.1.0"

[build]
user-parallelism = "no"

# **A Nikaia path and a Rust path are resolved against different things**, which
# is worth a line because getting it wrong costs a confusing message.  This one
# is read by `project::packages_of` and is relative to **this directory**.  A
# `type = "rust"` dependency is passed to Cargo verbatim (ADR-002 D1), so it is
# relative to the *generated* manifest under `target/nikaia/build/` - which is
# why `examples/foreign-runtime/serve` climbs four levels and this climbs one.
[dependencies]
http = { path = "../http" }
